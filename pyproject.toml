[project]
name = "langchain-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samir Vaniya", email = "skvaniya6275@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-rag = "langchain_rag:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
